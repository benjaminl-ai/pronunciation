<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 英文發音練習</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 1.5rem; }
        input[type="text"] { width: 80%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #1a73e8; }
        .btn-group { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-speak { background: #34a853; color: white; }
        .btn-record { background: #4285f4; color: white; }
        .recording { background: #ea4335 !important; animation: pulse 1.5s infinite; }
        #status { color: #666; font-size: 0.9rem; margin: 10px 0; }
        #feedback { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: left; border-left: 4px solid #4285f4; margin-top: 20px; display: none; line-height: 1.6; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ 英文發音教練</h1>
    <input type="text" id="wordInput" placeholder="請輸入單字或句子...">
    
    <div class="btn-group">
        <button class="btn-speak" onclick="listenStandard()">🔊 聽示範</button>
        <button id="recordBtn" class="btn-record" onclick="toggleRecording()">🎤 開始試讀</button>
    </div>

    <p id="status">狀態：準備就緒</p>
    <div id="feedback" id="feedbackBox"></div>
</div>

<script>
// 修改這部分
const part1 = "AIzaSyBi9clRvxy7szWBT";
const part2 = "g9E8ch1TGmiCmTFLRM";
const MY_SECRET_KEY = part1 + part2;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // 1. 聽標準發音
    function listenStandard() {
        const text = document.getElementById('wordInput').value;
        if (!text) return alert("請先輸入內容");
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    // 2. 錄音控制
    async function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('status');

        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = analyzeSpeech;
            
            mediaRecorder.start();
            isRecording = true;
            btn.innerText = "🛑 停止錄音";
            btn.classList.add('recording');
            status.innerText = "正在錄音中...";
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.innerText = "🎤 開始試讀";
            btn.classList.remove('recording');
            status.innerText = "AI 正在思考中...";
        }
    }

    // 3. 呼叫 Gemini
    async function analyzeSpeech() {
        const word = document.getElementById('wordInput').value;
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            
            const payload = {
                contents: [{
                    parts: [
                        { text: `你是一位親切的英文老師。學生讀了「${word}」這個字。請分析錄音內容，給予發音評價與具體的改善建議（如嘴型或重音）。請用繁體中文回答。` },
                        inline_data: {mime_type: "audio/mp3", data: base64Audio}
                    ]
                }]
            };

            try {
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${MY_SECRET_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                const feedbackText = data.candidates[0].content.parts[0].text;
                
                const fbDiv = document.getElementById('feedback');
                fbDiv.innerHTML = "<strong>老師評價：</strong><br>" + feedbackText.replace(/\n/g, '<br>');
                fbDiv.style.display = "block";
                document.getElementById('status').innerText = "分析完畢！";
            } catch (error) {
                alert("API 呼叫失敗，請檢查 Key 是否正確或額度已滿。");
                document.getElementById('status').innerText = "發生錯誤";
            }
        };
    }
</script>

</body>
</html>
