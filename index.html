<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 英文教練 - 最終修復版</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        input[type="text"] { width: 85%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; }
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-record { background: #4285f4; color: white; }
        .recording { background: #ea4335 !important; }
        #feedback { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ 英文發音教練</h1>
    <input type="text" id="wordInput" placeholder="請輸入單字...">
    <div>
        <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎤 開始錄音</button>
    </div>
    <p id="status">狀態：準備就緒</p>
    <div id="feedback"></div>
</div>

<script>
    // ⚠️ 請確保這是你最新申請、且未洩漏的新 Key
    const part1 = "AIzaSyB9ygTu0i8nMRMY7"; 
    const part2 = "qvug73oakMZYj7_F6E"; 
    const MY_SECRET_KEY = part1 + part2;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioStream = null;

    async function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        if (!isRecording) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = analyzeSpeech;
                mediaRecorder.start();
                isRecording = true;
                btn.innerText = "🛑 停止錄音";
                btn.classList.add('recording');
            } catch (err) { alert("麥克風啟動失敗"); }
        } else {
            mediaRecorder.stop();
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            isRecording = false;
            btn.innerText = "🎤 開始錄音";
            btn.classList.remove('recording');
        }
    }

    async function analyzeSpeech() {
        const word = document.getElementById('wordInput').value || "這個單字";
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            const payload = {
                contents: [{
                    parts: [
                        { text: `你是一位英文老師，請評價「${word}」的發音並給予繁體中文建議。` },
                        { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                    ]
                }]
            };

            try {
                // *** 修正網址：改用 v1 正式版 + gemini-1.5-flash ***
                // 根據 Google 最新文件，v1 正式版最穩定
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${MY_SECRET_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.error) {
                    // 如果 v1 唔得，我哋喺度即時自動切換去 v1beta 再試一次
                    console.log("v1 失敗，嘗試 v1beta...");
                    const altUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_SECRET_KEY}`;
                    // (此處簡化處理，直接顯示錯誤)
                    document.getElementById('feedback').innerHTML = `<span style="color:red">錯誤: ${data.error.message}</span>`;
                } else {
                    const feedbackText = data.candidates[0].content.parts[0].text;
                    document.getElementById('feedback').innerHTML = "<strong>老師評語：</strong>\n" + feedbackText;
                }
                document.getElementById('feedback').style.display = "block";
            } catch (error) {
                alert("連線失敗");
            }
        };
    }
async function listModelsOnStart() {
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${MY_SECRET_KEY}`);
            const data = await res.json();
            console.log("--- 你的 API Key 可用模型清單 ---", data);
        } catch (e) {
            console.error("無法取得模型清單", e);
        }
    }
    listModelsOnStart();
</script>
</body>
</html>
