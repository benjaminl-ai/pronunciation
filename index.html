<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI 英文發音教練</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; text-align: center; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ddd; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; transition: 0.3s; }
        button:disabled { background-color: #ccc; }
        #feedback { margin-top: 20px; padding: 15px; text-align: left; background: #e9ecef; border-left: 5px solid #007bff; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 AI 英文發音教練</h2>
    <input type="password" id="apiKey" placeholder="在此貼上你的 Gemini API Key">
    <br>
    <input type="text" id="wordInput" placeholder="輸入英文字 (例如: Phenomenon)">
    <button onclick="speak()">1. 聽發音</button>
    <hr>
    <button id="recordBtn" onclick="toggleRecording()">2. 開始錄音 (試讀)</button>
    <p id="status">狀態: 準備就緒</p>
    <div id="feedback" style="display:none;"></div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // 1. 聽發音 (Web Speech API)
    function speak() {
        const text = document.getElementById('wordInput').value;
        if (!text) return alert("請先輸入單字");
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9; // 稍微慢一點點
        window.speechSynthesis.speak(utterance);
    }

    // 2. 錄音功能
    async function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('status');

        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = sendToGemini;
            
            mediaRecorder.start();
            isRecording = true;
            btn.innerText = "停止錄音";
            btn.style.backgroundColor = "red";
            status.innerText = "狀態: 錄音中...";
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.innerText = "2. 開始錄音 (試讀)";
            btn.style.backgroundColor = "#007bff";
            status.innerText = "狀態: 正在分析中，請稍候...";
        }
    }

    // 3. 傳送至 Gemini API
    async function sendToGemini() {
        const apiKey = document.getElementById('apiKey').value;
        const word = document.getElementById('wordInput').value;
        if (!apiKey) return alert("AIzaSyBi9clRvxy7szWBTg9E8ch1TGmiCmTFLRM");

        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            
            const payload = {
                contents: [{
                    parts: [
                        { text: `你是一位專業英文老師。學生正在練習讀單字「${word}」。請聽這段錄音，評價發音是否準確。請具體指出哪一個音節可以改善，並給予鼓勵性的建議。請用繁體中文回答。` },
                        { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                    ]
                }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                const feedbackText = data.candidates[0].content.parts[0].text;
                
                const fbDiv = document.getElementById('feedback');
                fbDiv.innerText = feedbackText;
                fbDiv.style.display = "block";
                document.getElementById('status').innerText = "狀態: 分析完成！";
            } catch (error) {
                console.error(error);
                alert("傳送失敗，請檢查 API Key 或網路連接。");
            }
        };
    }
</script>

</body>
</html>
