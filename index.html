<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 英文發音教練</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h1 { color: #1a73e8; font-size: 1.5rem; }
        input[type="text"] { width: 85%; padding: 15px; border: 2px solid #dfe1e5; border-radius: 15px; font-size: 1.2rem; margin-bottom: 10px; outline: none; }
        
        /* 語速調校樣式 */
        .speed-control { margin: 10px 0; font-size: 0.9rem; color: #5f6368; }
        #speedRange { width: 70%; vertical-align: middle; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button { padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.2s; }
        .btn-speak { background: #34a853; color: white; }
        .btn-record { background: #4285f4; color: white; }
        .recording { background: #ea4335 !important; animation: blink 1s infinite; }
        
        #status { margin: 15px 0; font-weight: bold; color: #1a73e8; min-height: 1.2rem; }
        #feedback { background: #f1f3f4; padding: 15px; border-radius: 15px; text-align: left; display: none; line-height: 1.5; font-size: 1rem; color: #3c4043; }
        
        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🏫 AI 英文發音教練</h1>
    
    <input type="text" id="wordInput" placeholder="輸入單字或句子...">
    
    <div class="speed-control">
        🐢 語速：<input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1"> 🚀
        <br><span id="speedValue">1.0</span>x
    </div>

    <div class="btn-group">
        <button class="btn-speak" onclick="listenStandard()">🔊 聆聽 </button>
        <button id="recordBtn" class="btn-record" onclick="toggleRecording()">🎤 試讀 (錄音)</button>
    </div>

    <p id="status">先輸入單字或句子！</p>
    <div id="feedback"></div>
</div>

<script>
    const part1 = "AIzaSyB9ygTu0i8nMRMY7"; 
    const part2 = "qvug73oakMZYj7_F6E"; 
    const MY_SECRET_KEY = part1 + part2;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioStream = null;

    // 更新顯示語速數值
    document.getElementById('speedRange').oninput = function() {
        document.getElementById('speedValue').innerText = this.value;
    };

    // 1. 聽標準發音 (Natural Reader 聲音)
    function listenStandard() {
        const text = document.getElementById('wordInput').value;
        if (!text) return alert("請先輸入單字");
        
        window.speechSynthesis.cancel(); // 先停止之前的聲音
        const utterance = new SpeechSynthesisUtterance(text);
        
        // 嘗試搵出最自然的英文聲音
        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(v => v.name.includes('Google UK English') || v.name.includes('Samantha')) || voices[0];
        if (englishVoice) utterance.voice = englishVoice;
        
        utterance.lang = 'en-US';
        utterance.rate = document.getElementById('speedRange').value; // 套用語速
        window.speechSynthesis.speak(utterance);
        document.getElementById('status').innerText = "播放示範中...";
    }

    // 2. 錄音控制
    async function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('status');

        if (!isRecording) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = analyzeSpeech;
                
                mediaRecorder.start();
                isRecording = true;
                btn.innerText = "🛑 停止錄音";
                btn.classList.add('recording');
                status.innerText = "🔴 請錄音...";
                document.getElementById('feedback').style.display = "none";
            } catch (err) { alert("開唔到麥克風"); }
        } else {
            mediaRecorder.stop();
            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            isRecording = false;
            btn.innerText = "🎤 我試吓讀 (錄音)";
            btn.classList.remove('recording');
            status.innerText = "⏳ AI 老師諗緊 (請等幾秒)...";
        }
    }

    // 3. AI 分析 (簡短版)
    async function analyzeSpeech() {
        const word = document.getElementById('wordInput').value || "這個內容";
        const status = document.getElementById('status');
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            
            const payload = {
    contents: [{
        parts: [
            { text: `你是一位嚴格但親切的英文老師。學生的目標單字/句子是：「${word}」。
            請細心聽這段錄音，並執行以下步驟：
            1. 檢查學生是否有讀錯、漏讀或發音不標準的地方。
            2. **精確指出**哪一個單字讀錯了（例如：你把 "Apple" 讀成了 "Abble"）。
            3. 用最簡單的初中程度中文解釋：錯在哪裡？正確應該怎麼讀？
            4. 如果真的讀得很爛，請誠實指出並給予具體建議，不要只說好話。
            5. 回應保持簡短，不超過 4 句話。` },
            { inline_data: { mime_type: "audio/webm", data: base64Audio } }
        ]
    }]
};

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${MY_SECRET_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (data.error) {
                    status.innerText = "❌ 發生咗啲錯誤";
                    console.error(data.error);
                } else {
                    const feedbackText = data.candidates[0].content.parts[0].text;
                    const fbDiv = document.getElementById('feedback');
                    fbDiv.innerHTML = "<strong>老師評語：</strong><br>" + feedbackText;
                    fbDiv.style.display = "block";
                    status.innerText = "✅ 分析完成！";
                }
            } catch (error) {
                status.innerText = "❌ 連線失敗";
            }
        };
    }

    // 載入聲音清單 (部分瀏覽器需要)
    window.speechSynthesis.onvoiceschanged = () => {};
</script>

</body>
</html>
