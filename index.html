<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro AI English Coach</title>
    <style>
        :root {
            --panel-color: #c0c0c0;
            --display-bg: #1a1a1a;
            --led-orange: #ff9d00;
            --plastic-black: #333;
        }

        body {
            background: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 錄音機主體 */
        .recorder-case {
            background: var(--panel-color);
            border: 4px solid #888;
            border-radius: 10px;
            padding: 25px;
            width: 350px;
            box-shadow: inset -5px -5px 10px #888, inset 5px 5px 10px #fff, 0 20px 40px rgba(0,0,0,0.5);
        }

        /* 模擬顯示屏 */
        .display-panel {
            background: var(--display-bg);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            border: 3px solid #555;
            box-shadow: inset 0 0 10px #000;
        }

        h1 {
            color: var(--led-orange);
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--led-orange);
        }

        #status {
            color: #00ff00;
            font-size: 0.8rem;
            height: 1.2rem;
            margin: 5px 0;
        }

        /* 模擬 VU Meter (錶靶) */
        .vu-meter {
            display: flex;
            gap: 2px;
            height: 10px;
            margin-top: 10px;
        }
        .vu-bar {
            flex: 1;
            background: #222;
        }
        .recording .vu-bar {
            animation: vu-jump 0.2s infinite alternate;
        }
        .vu-bar:nth-child(n+8) { background: #550000; }
        .recording .vu-bar:nth-child(n+8) { background: #ff0000; }

        @keyframes vu-jump {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* 輸入框 */
        input[type="text"] {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 15px;
        }

        /* 語速調校 (像收音機頻率掣) */
        .speed-control {
            font-size: 0.7rem;
            color: #444;
            margin-bottom: 15px;
            text-align: left;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--plastic-black);
        }

        /* 機械按鈕組 */
        .tape-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px #666, 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px #444;
        }

        .btn-play { background: #ddd; color: #333; } /* 聽示範 */
        .btn-rec { background: #cc0000; color: white; } /* 錄音 */

        /* AI 反饋區域 */
        #feedback {
            margin-top: 20px;
            background: #e0e0d0; /* 像舊紙張的顏色 */
            padding: 15px;
            border: 1px solid #999;
            color: #333;
            font-size: 0.9rem;
            display: none;
            text-align: left;
            line-height: 1.4;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

<div class="recorder-case">
    <div class="display-panel">
        <h1>AI TAPE RECORDER</h1>
        <div id="status">IDLE</div>
        <div class="vu-meter" id="vuMeter">
            <div class="vu-bar"></div><div class="vu-bar"></div><div class="vu-bar"></div><div class="vu-bar"></div>
            <div class="vu-bar"></div><div class="vu-bar"></div><div class="vu-bar"></div><div class="vu-bar"></div>
            <div class="vu-bar"></div><div class="vu-bar"></div>
        </div>
    </div>

    <input type="text" id="wordInput" placeholder="ENTER TEXT HERE...">

    <div class="speed-control">
        PITCH / SPEED: <span id="speedValue">1.0</span>x
        <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1">
    </div>

    <div class="tape-btns">
        <button class="btn-play" onclick="listenStandard()">▶ PLAY DEMO</button>
        <button class="btn-rec" id="recordBtn" onclick="toggleRecording()">● REC / STOP</button>
    </div>

    <div id="feedback"></div>
</div>

<script>
    // --- 核心 logic 保持不變 ---
    const part1 = "AIzaSyB9ygTu0i8nMRMY7"; 
    const part2 = "qvug73oakMZYj7_F6E"; 
    const MY_SECRET_KEY = part1 + part2;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioStream = null;

    document.getElementById('speedRange').oninput = function() {
        document.getElementById('speedValue').innerText = this.value;
    };

    function listenStandard() {
        const text = document.getElementById('wordInput').value;
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = document.getElementById('speedRange').value;
        window.speechSynthesis.speak(utterance);
        document.getElementById('status').innerText = "PLAYING...";
        utterance.onend = () => document.getElementById('status').innerText = "IDLE";
    }

    async function toggleRecording() {
        const status = document.getElementById('status');
        const container = document.querySelector('.recorder-case');

        if (!isRecording) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = analyzeSpeech;
                mediaRecorder.start();
                isRecording = true;
                status.innerText = "RECORDING...";
                container.classList.add('recording');
                document.getElementById('feedback').style.display = "none";
            } catch (err) { alert("MIC ERROR"); }
        } else {
            mediaRecorder.stop();
            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            isRecording = false;
            status.innerText = "PROCESSING...";
            container.classList.remove('recording');
        }
    }

    async function analyzeSpeech() {
        const word = document.getElementById('wordInput').value;
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            const payload = {
                contents: [{
                    parts: [
                        { text: `你是一位嚴格但親切的英文老師。學生的目標是：「${word}」。
                        請仔細聽錄音並：
                        1. 檢查學生是否有讀錯、漏讀或發音不標準的地方。
                        2. 精確指出哪個單字讀錯（例如：把 "Apple" 讀成 "Abble"）。
                        3. 用初中程度中文簡短解釋錯處:：錯在哪裡？正確應該怎麼讀？
                        4. 請誠實指出並給予具體建議，不要只說好話。
                        4. 總長不超過10 句話, 每句話分行表達。` },
                        { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                    ]
                }]
            };

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${MY_SECRET_KEY}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                const feedbackText = data.candidates[0].content.parts[0].text;
                const fbDiv = document.getElementById('feedback');
                fbDiv.innerHTML = "<strong>ANALYSIS:</strong><br>" + feedbackText;
                fbDiv.style.display = "block";
                document.getElementById('status').innerText = "DONE";
            } catch (error) {
                document.getElementById('status').innerText = "ERROR";
            }
        };
    }
</script>

</body>
</html>
